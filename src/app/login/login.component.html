<div class="login-page">

  <!-- Main Content -->
  <div class="main-container">

    <!-- LEFT SECTION -->
    <div class="left-section">

      <div class="promotion-card">

        <!-- Java Poster -->
        <div class="poster-container">
          <img
            src="assets/about/login/java-poster.png"
            alt="Java Programming Training"
            class="java-poster"
          />
        </div>

        <!-- Welcome Box -->
        <div class="welcome-box">

          <span class="welcome-tag">
            JavaBridge Consultancy
          </span>

          <h1>
            Welcome Back!
          </h1>

          <p>
            Continue your learning journey. Access your enrolled courses,
            class videos, notes, assignments and important updates.
          </p>

        </div>

      </div>

    </div>


    <!-- RIGHT LOGIN SECTION -->
    <div class="right-section">

      <div class="login-card">

        <!-- Lock Icon -->
        <div class="lock-circle">
          🔐
        </div>

        <h2>
          Student Login
        </h2>

        <p class="login-subtitle">
          Enter your registered email and password
        </p>


        <!-- Email -->
        <div class="form-group">

          <label>
            Email Address
            <span>*</span>
          </label>

          <div class="input-wrapper">

            <span class="input-icon">
              ✉
            </span>

            <input
              type="email"
              [(ngModel)]="loginData.email"
              placeholder="Enter your email address"
            />

          </div>

        </div>


        <!-- Password -->
        <div class="form-group">

          <label>
            Password
            <span>*</span>
          </label>

          <div class="input-wrapper">

            <span class="input-icon">
              🔑
            </span>

            <input
              type="password"
              [(ngModel)]="loginData.password"
              placeholder="Enter your password"
            />

          </div>

        </div>


        <!-- Links -->
        <div class="login-links">

        <a routerLink="/create-account">
  Create Account
</a>


          <a href="#">
            Forgot Password?
          </a>

        </div>


        <!-- Login Button -->
        <button
          class="login-now-btn"
          (click)="login()"
        >
          Login Now
        </button>

      </div>

    </div>

  </div>

</div>
