<div class="chat-agent">

  <!-- ================= CHAT WINDOW ================= -->

  <div class="chat-window" *ngIf="isOpen">

    <!-- Header -->
    <div class="chat-header">

      <div class="header-left">

        <div class="bot-avatar">
          <span>🤖</span>
          <div class="avatar-online"></div>
        </div>

        <div class="header-content">
          <h3>JavaBridgeConnect</h3>

          <div class="online-text">
            <span class="online-dot"></span>
            AI Assistant • Online
          </div>
        </div>

      </div>

      <button
        class="close-chat"
        (click)="toggleChat()"
        type="button">
        ×
      </button>

    </div>


    <!-- ================= CHAT BODY ================= -->

    <div class="chat-body">

      <!-- Welcome Card -->

      <div class="welcome-card">

        <div class="welcome-icon">
          👋
        </div>

        <div>
          <h4>Welcome!</h4>

          <p>
            Your Java learning journey starts here.
          </p>
        </div>

      </div>


      <!-- Bot Message -->

      <div class="chat-message bot">

        <div class="message-avatar">
          🤖
        </div>

        <div class="message-bubble">

          <p>
            Hi! 👋
          </p>

          <p>
            I'm the <strong>JavaBridgeConnect AI Assistant</strong>.
          </p>

          <p>
            What would you like to know?
          </p>

        </div>

      </div>


      <!-- Quick Actions -->

      <div class="quick-heading">
        <span>✨</span>
        Popular options
      </div>


      <div class="quick-grid">

        <button
          type="button"
          (click)="sendQuickMessage('Java Training')">

          <span class="quick-icon orange">
            ☕
          </span>

          <span>
            <strong>Java Training</strong>
            <small>Learn Java</small>
          </span>

          <b>›</b>

        </button>


        <button
          type="button"
          (click)="sendQuickMessage('Courses')">

          <span class="quick-icon blue">
            📚
          </span>

          <span>
            <strong>Our Courses</strong>
            <small>View programs</small>
          </span>

          <b>›</b>

        </button>


        <button
          type="button"
          (click)="sendQuickMessage('Enquiry')">

          <span class="quick-icon purple">
            📝
          </span>

          <span>
            <strong>Enquire Now</strong>
            <small>Talk to our team</small>
          </span>

          <b>›</b>

        </button>


        <button
          type="button"
          (click)="sendQuickMessage('Contact')">

          <span class="quick-icon green">
            📞
          </span>

          <span>
            <strong>Contact Us</strong>
            <small>Get in touch</small>
          </span>

          <b>›</b>

        </button>

      </div>


      <!-- User Message -->

      <div
        class="chat-message user"
        *ngIf="userMessage">

        <div class="message-bubble">

          <p>
            {{ userMessage }}
          </p>

        </div>

      </div>


      <!-- Bot Response -->

      <div
        class="chat-message bot"
        *ngIf="botResponse">

        <div class="message-avatar">
          🤖
        </div>

        <div class="message-bubble">

          <p>
            {{ botResponse }}
          </p>

        </div>

      </div>

    </div>


    <!-- ================= INPUT ================= -->

    <div class="chat-footer">

      <div class="input-box">

        <input
          type="text"
          [(ngModel)]="message"
          placeholder="Ask about Java courses..."
          autocomplete="off"
          (keyup.enter)="sendMessage()"
        />

        <button
          type="button"
          (click)="sendMessage()"
          [disabled]="!message.trim()">

          <span>➤</span>

        </button>

      </div>

      <div class="powered">
        <span>⚡</span>
        Powered by <strong>JavaBridgeConnect</strong>
      </div>

    </div>

  </div>


  <!-- ================= FLOATING BUTTON ================= -->

  <button
    type="button"
    class="chat-launcher"
    (click)="toggleChat()">

    <span
      class="launcher-icon"
      *ngIf="!isOpen">
      🤖
    </span>

    <span
      class="launcher-close"
      *ngIf="isOpen">
      ×
    </span>

    <span
      class="notification"
      *ngIf="!isOpen">
    </span>

  </button>

</div>
