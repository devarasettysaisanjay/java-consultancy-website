<section class="page-header">

  <div class="container">

    <h1>
      Enroll for {{ course?.title }}
    </h1>

    <p>
      Home / Enroll / {{ course?.title }}
    </p>

  </div>

</section>


<section class="enroll-section">

  <div class="container enroll-grid">

    <div class="form-card">

      <h2>
        Enrollment Form
      </h2>

      <form
        #form="ngForm"
        (ngSubmit)="proceedToPayment()">

        <label>
          Full Name *
        </label>

        <input
          type="text"
          name="fullName"
          [(ngModel)]="student.fullName"
          required>


        <label>
          Email Address *
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="student.email"
          required>


        <label>
          Mobile Number *
        </label>

        <input
          type="text"
          name="mobile"
          [(ngModel)]="student.mobile"
          required>


        <label>
          Experience
        </label>

        <select
          name="experience"
          [(ngModel)]="student.experience">

          <option value="">
            Select experience
          </option>

          <option>
            Fresher
          </option>

          <option>
            1 - 3 Years
          </option>

          <option>
            3 - 5 Years
          </option>

          <option>
            5+ Years
          </option>

        </select>


        <label>
          Current Status
        </label>

        <select
          name="currentStatus"
          [(ngModel)]="student.currentStatus">

          <option value="">
            Select current status
          </option>

          <option>
            Student
          </option>

          <option>
            Working
          </option>

          <option>
            Looking for Job
          </option>

        </select>


        <label>
          How did you find us?
        </label>

        <select
          name="howFoundUs"
          [(ngModel)]="student.howFoundUs">

          <option value="">
            Select an option
          </option>

          <option>
            Google
          </option>

          <option>
            YouTube
          </option>

          <option>
            Friend
          </option>

          <option>
            LinkedIn
          </option>

        </select>


        <label>
          Message
        </label>

        <textarea
          name="message"
          [(ngModel)]="student.message">
        </textarea>


        <label class="checkbox">

          <input
            type="checkbox"
            required>

          I agree to the Terms & Conditions

        </label>


        <button
          type="submit"
          class="payment-btn"
          [disabled]="form.invalid">

          Proceed to Payment

        </button>

      </form>

    </div>


    <div class="order-card">

      <h2>
        Order Summary
      </h2>

      <h3>
        {{ course?.icon }}
        {{ course?.title }}
      </h3>

      <p>
        {{ course?.duration }}
      </p>

      <hr>

      <div class="summary-row">

        <span>
          Course Fee
        </span>

   <strong>
  ₹{{ getCourseFee() }}
</strong>

      </div>

      <div class="summary-row">

        <span>
          GST (18%)
        </span>

      <strong>
  ₹{{ getGst() }}
</strong>

      </div>

      <hr>

      <div class="total">

        <span>
          Total Amount
        </span>

        <strong>
  ₹{{ getTotalAmount() }}
</strong>
      </div>

    </div>

  </div>

</section>
